name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0). Must match the VERSION file.'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine & validate tag
        id: tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ github.event.inputs.version }}'
            if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          }
          $versionFile = (Get-Content VERSION -Raw -ErrorAction Stop).Trim()
          if ($tag.Trim() -ne "v$versionFile") {
            Write-Error "Tag '$tag' must match VERSION file 'v$versionFile'."
            exit 1
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8

      - name: Build zip + SHA256 checksums
        id: build
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $zip = "WindowsCleanupSuite-$tag.zip"
          # Compress-Archive flattens all entries to file names (even with
          # relative paths), so same-named files like the 14 Manifest.psd1
          # collide. New-WCSZip keeps the directory structure via .NET ZipFile.
          . .\Tools\New-WCSZip.ps1
          $count = New-WCSZip -DestinationPath $zip -ExcludeDirNames '.git', 'Logs', 'Backups'
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Set-Content "$zip.SHA256" -Encoding ASCII
          Write-Host "Built $zip ($count files) and $zip.SHA256"
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append

      - name: Create GitHub Release
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $zip = "${{ steps.build.outputs.zip }}"
          $sha = "$zip.SHA256"
          $title = "WindowsCleanupSuite $tag"
          $assets = @((Join-Path $env:GITHUB_WORKSPACE $zip), (Join-Path $env:GITHUB_WORKSPACE $sha))
          # gh release create fails when the release already exists; delete it
          # first so re-pushing a tag (e.g. after a history rewrite) works.
          $existing = gh release view $tag -R ${{ github.repository }} --json tagName -q .tagName 2>$null
          if ($existing) {
            Write-Host "Release $tag already exists - deleting it before recreating."
            gh release delete $tag --yes -R ${{ github.repository }}
          }
          gh release create $tag --title $title --notes-file CHANGELOG.md -R ${{ github.repository }} $assets
