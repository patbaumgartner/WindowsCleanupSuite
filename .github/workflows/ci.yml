name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # weekly snapshot builds

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax (parse all .ps1/.psd1)
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in (Get-ChildItem -Path . -Recurse -File -Include '*.ps1', '*.psd1' -ErrorAction SilentlyContinue)) {
            $tokens = $null; $errors = $null
            try { [System.Management.Automation.Language.Parser]::ParseInput((Get-Content -Raw $f.FullName -ErrorAction Stop), [ref]$tokens, [ref]$errors) }
            catch { Write-Host "PARSE ERROR: $($f.FullName): $($_.Exception.Message)"; $bad++ }
            $es = @($errors | Where-Object { $null -ne $_ })
            if ($es.Count) { Write-Host "SYNTAX ERRORS in $($f.FullName): $($es -join '; ')"; $bad++ }
          }
          if ($bad -gt 0) { Write-Host "$bad file(s) with parse errors"; exit 1 }
          Write-Host "All files parse OK"

      - name: Parse with Windows PowerShell 5.1 parser (legacy shell compat)
        shell: pwsh
        run: |
          $ps51 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          if (Test-Path $ps51) {
            & $ps51 -NoProfile -ExecutionPolicy Bypass -File Tests\Invoke-PS51ParseCheck.ps1
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            Write-Host 'Windows PowerShell 5.1 not present on this runner - skipping'
          }

      - name: Run structural tests
        shell: pwsh
        run: pwsh -NoProfile -File Tests\Invoke-SuiteTests.ps1

      - name: Run structural tests (Windows PowerShell 5.1 runtime)
        shell: pwsh
        run: |
          # Parsing alone cannot catch 5.1 RUNTIME differences - run the safe suite too.
          $ps51 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          if (Test-Path $ps51) {
            & $ps51 -NoProfile -ExecutionPolicy Bypass -File Tests\Invoke-SuiteTests.ps1
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            Write-Host 'Windows PowerShell 5.1 not present on this runner - skipping'
          }

  snapshot:
    needs: [validate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create snapshot archive
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 8)
          $zip = "WindowsCleanupSuite-snapshot-$shortSha.zip"
          # Compress-Archive flattens all entries to file names (even with
          # relative paths), so same-named files like the 14 Manifest.psd1
          # collide. New-WCSZip keeps the directory structure via .NET ZipFile.
          . .\Tools\New-WCSZip.ps1
          $count = New-WCSZip -DestinationPath $zip -ExcludeDirNames '.git', 'Logs', 'Backups'
          Write-Host "Created $zip with $count files ($((Get-Item $zip).Length) bytes)"
          Get-FileHash -Path $zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($zip))" } | Set-Content "$zip.SHA256" -Encoding ASCII
          Get-ChildItem $zip, "$zip.SHA256"

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsCleanupSuite-snapshot-${{ github.sha }}
          path: |
            WindowsCleanupSuite-snapshot-*.zip
            WindowsCleanupSuite-snapshot-*.zip.SHA256
          retention-days: 7
